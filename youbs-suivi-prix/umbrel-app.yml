manifestVersion: 1
id: youbs-suivi-prix
name: Suivi de prix
tagline: Suivez le prix de vos articles Amazon, eBay et Leboncoin
icon: https://raw.githubusercontent.com/youbs-dev/youbs-umbrel-app-store/main/src/suivi-prix/icon.svg
category: finance
version: "0.1.0"
port: 8770
description: >-
  Collez le lien d'un article Amazon, eBay ou Leboncoin : l'app relève son prix à intervalle
  régulier et en garde l'historique en graphique. Rangez vos articles par catégorie et fixez
  un seuil par article.


  Vous recevez une notification (ntfy, Telegram, e-mail, Discord… via Apprise) quand le prix passe
  sous votre seuil, ou quand il est anormalement bas par rapport à son prix habituel
  (par défaut 20 % sous la médiane des 30 derniers jours).


  Les prix eBay passent par l'API officielle d'eBay : créez un compte gratuit sur
  developer.ebay.com et saisissez vos clés de production dans les Réglages de l'app.
  Si Prowlarr (youbs) est installé, son FlareSolverr sert de secours pour Amazon et Leboncoin.
developer: youbs
website: https://github.com/youbs-dev/youbs-umbrel-app-store
submitter: youbs
submission: https://github.com/youbs-dev/youbs-umbrel-app-store
repo: https://github.com/youbs-dev/youbs-umbrel-app-store/tree/main/src/suivi-prix
support: https://github.com/youbs-dev/youbs-umbrel-app-store/issues
gallery: []
releaseNotes: >-
  Première version : suivi des prix Amazon, eBay (API officielle) et Leboncoin, catégories,
  historique en graphique, alertes sous seuil et prix anormalement bas.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
