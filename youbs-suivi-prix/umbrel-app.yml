manifestVersion: 1
id: youbs-suivi-prix
name: Suivi de prix
tagline: Cherchez un produit sur Amazon, eBay et Leboncoin et suivez son prix
icon: https://raw.githubusercontent.com/youbs-dev/youbs-umbrel-app-store/main/src/suivi-prix/icon.svg
category: finance
version: "0.4.0"
port: 8770
description: >-
  Tapez une référence ou une désignation : l'app interroge Amazon, Leboncoin et eBay et liste
  les offres par prix croissant, en écartant celles dont le titre ne contient pas tous les mots
  recherchés (filtres de prix et mots à exclure en plus). Suivez ensuite un résultat précis, ou
  créez une veille sur la recherche entière : elle est relancée régulièrement et garde
  l'historique de la meilleure offre. Regroupez sous un même produit les offres de plusieurs sites
  pour comparer leurs prix sur une seule carte et un seul graphique. Rangez vos suivis par
  catégorie et fixez un seuil.


  Vous recevez une notification (ntfy, Telegram, e-mail, Discord… via Apprise) quand le prix passe
  sous votre seuil, ou quand il est anormalement bas par rapport à son prix habituel
  (par défaut 20 % sous la médiane des 30 derniers jours).


  Amazon passe par FlareSolverr : installez Prowlarr (youbs), dont le FlareSolverr est utilisé
  automatiquement. Les prix eBay passent par l'API officielle d'eBay : créez un compte gratuit sur
  developer.ebay.com et saisissez vos clés de production dans les Réglages de l'app.
developer: youbs
website: https://github.com/youbs-dev/youbs-umbrel-app-store
submitter: youbs
submission: https://github.com/youbs-dev/youbs-umbrel-app-store
repo: https://github.com/youbs-dev/youbs-umbrel-app-store/tree/main/src/suivi-prix
support: https://github.com/youbs-dev/youbs-umbrel-app-store/issues
gallery: []
releaseNotes: >-
  Écarter un résultat : le bouton ✕ d'un résultat de recherche (ou « Écarter cette offre » sur une
  veille) retire une fausse correspondance de cette recherche et de sa veille, et efface les
  relevés faux qu'elle avait donnés. Les résultats écartés peuvent être rétablis.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
