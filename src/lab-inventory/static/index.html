<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lab Inventory</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#667085; --accent:#1f6feb; --border:#e3e6ea; --danger:#d1242f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#171b22; --text:#e6e8eb; --muted:#8b949e; --border:#2a313b; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; gap:8px; align-items:center; z-index:2; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { padding:16px; max-width:760px; margin:0 auto; padding-bottom:110px; }
  input, select, textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font:inherit; }
  textarea { min-height:70px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 14px; background:var(--border); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; }
  button.danger { background:var(--danger); color:#fff; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .list { display:grid; gap:10px; margin-top:12px; }
  .item { display:flex; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer; }
  .item img, .thumb { width:64px; height:64px; object-fit:cover; border-radius:8px; background:var(--border); flex:none; }
  .item .t { font-weight:600; } .item .s { font-size:13px; color:var(--muted); }
  .qty { margin-left:auto; font-weight:700; font-size:18px; align-self:center; }
  .fab { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:16px 28px; border-radius:40px; font-size:17px; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .hidden { display:none !important; }
  .photo-big { width:100%; max-height:280px; object-fit:contain; border-radius:8px; background:var(--border); }
  .spinner { text-align:center; padding:40px 0; color:var(--muted); }
  .links a { display:inline-block; margin:6px 8px 0 0; color:var(--accent); }
  .banner { background:#fff4e5; color:#7a4b00; padding:10px; border-radius:8px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td { padding:4px 0; border-bottom:1px solid var(--border); } td:first-child { color:var(--muted); width:45%; }
</style>
</head>
<body>
<header>
  <h1>🔌 Lab Inventory</h1>
  <button id="btnSettings" title="Réglages">⚙️</button>
</header>

<main>
  <!-- Liste -->
  <section id="viewList">
    <div id="keyBanner" class="banner hidden">Renseignez votre clé API Claude dans ⚙️ pour activer l'identification par photo.</div>
    <div class="row">
      <input id="search" type="search" placeholder="Rechercher (nom, référence, tiroir…)">
      <select id="filterCat" style="flex:0 0 38%"><option value="">Toutes catégories</option></select>
    </div>
    <div id="list" class="list"></div>
  </section>

  <!-- Identification en cours -->
  <section id="viewLoading" class="hidden">
    <img id="loadingPhoto" class="photo-big" alt="">
    <div class="spinner">🔍 Identification en cours et recherche de la datasheet…<br>(cela peut prendre une trentaine de secondes)</div>
  </section>

  <!-- Formulaire -->
  <section id="viewForm" class="hidden">
    <div id="aiError" class="banner hidden"></div>
    <img id="formPhoto" class="photo-big hidden" alt="">
    <form id="form">
      <label>Nom</label><input name="name" required>
      <div class="row">
        <div><label>Référence</label><input name="part_number"></div>
        <div><label>Fabricant</label><input name="manufacturer"></div>
      </div>
      <div class="row">
        <div><label>Catégorie</label><input name="category" list="cats"></div>
        <div><label>Boîtier</label><input name="package"></div>
      </div>
      <div class="row">
        <div><label>Quantité</label><input name="quantity" type="number" min="0" value="1"></div>
        <div><label>Emplacement</label><input name="location" placeholder="ex. Tiroir A3"></div>
      </div>
      <label>Description</label><textarea name="description"></textarea>
      <label>Datasheet (URL)</label><input name="datasheet_url" type="url">
      <label>Page fabricant (URL)</label><input name="manufacturer_url" type="url">
      <div class="links" id="formLinks"></div>
      <label>Caractéristiques (une par ligne, « clé : valeur »)</label><textarea name="specs" rows="5"></textarea>
      <label>Notes</label><textarea name="notes"></textarea>
      <div class="row" style="margin-top:16px">
        <button type="button" id="btnCancel">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
      <button type="button" id="btnDelete" class="danger hidden" style="width:100%;margin-top:10px">Supprimer</button>
    </form>
  </section>

  <!-- Réglages -->
  <section id="viewSettings" class="hidden card">
    <h3 style="margin-top:0">Réglages</h3>
    <p id="keyStatus" class="s"></p>
    <label>Clé API Claude (console.anthropic.com)</label>
    <input id="apiKey" type="password" placeholder="sk-ant-…">
    <div class="row" style="margin-top:12px">
      <button id="btnSettingsBack">Retour</button>
      <button id="btnSaveKey" class="primary">Enregistrer</button>
    </div>
  </section>
</main>

<datalist id="cats"></datalist>
<input id="fileInput" type="file" accept="image/*" capture="environment" class="hidden">
<button id="fab" class="primary fab">📷 Ajouter</button>

<script>
const CATEGORIES = ["Résistance","Condensateur","Inductance","Diode","LED","Transistor","Circuit intégré","Microcontrôleur","Régulateur","Capteur","Module","Connecteur","Interrupteur","Relais","Afficheur","Quartz/Oscillateur","Câble","Autre"];
const $ = s => document.querySelector(s);
const views = ["viewList","viewLoading","viewForm","viewSettings"];
let editingId = null, currentPhoto = null;

function show(v) { views.forEach(x => $("#"+x).classList.toggle("hidden", x !== v)); $("#fab").classList.toggle("hidden", v !== "viewList"); scrollTo(0,0); }
function esc(s) { return (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function api(path, opts={}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

CATEGORIES.forEach(c => { $("#filterCat").add(new Option(c, c)); $("#cats").append(new Option(c)); });

async function loadList() {
  const q = encodeURIComponent($("#search").value), cat = encodeURIComponent($("#filterCat").value);
  const items = await api(`/api/components?q=${q}&category=${cat}`);
  $("#list").innerHTML = items.length ? items.map(c => `
    <div class="item" data-id="${c.id}">
      ${c.photo ? `<img src="/photos/${esc(c.photo)}" loading="lazy">` : `<div class="thumb"></div>`}
      <div><div class="t">${esc(c.name)}</div>
        <div class="s">${esc([c.part_number, c.manufacturer].filter(Boolean).join(" · "))}</div>
        <div class="s">${esc([c.category, c.location].filter(Boolean).join(" · "))}</div></div>
      <div class="qty">×${c.quantity}</div>
    </div>`).join("") : `<p class="s" style="text-align:center;color:var(--muted)">Aucun composant. Touchez « 📷 Ajouter » pour photographier le premier.</p>`;
}
$("#list").onclick = e => { const it = e.target.closest(".item"); if (it) openEdit(+it.dataset.id); };
let t; $("#search").oninput = () => { clearTimeout(t); t = setTimeout(loadList, 250); };
$("#filterCat").onchange = loadList;

function specsToText(s) { return Object.entries(s || {}).map(([k,v]) => `${k} : ${v}`).join("\n"); }
function textToSpecs(t) { const o = {}; t.split("\n").forEach(l => { const i = l.indexOf(":"); if (i > 0) o[l.slice(0,i).trim()] = l.slice(i+1).trim(); }); return o; }

function fillForm(c, error) {
  const f = $("#form"); f.reset();
  for (const el of f.elements) if (el.name && el.name !== "specs" && c[el.name] != null) el.value = c[el.name];
  f.specs.value = specsToText(c.specs);
  currentPhoto = c.photo || null;
  $("#formPhoto").classList.toggle("hidden", !currentPhoto);
  if (currentPhoto) $("#formPhoto").src = "/photos/" + currentPhoto;
  $("#formLinks").innerHTML = [c.datasheet_url && `<a href="${esc(c.datasheet_url)}" target="_blank">📄 Datasheet</a>`,
                               c.manufacturer_url && `<a href="${esc(c.manufacturer_url)}" target="_blank">🏭 Page fabricant</a>`].filter(Boolean).join("");
  const msg = error ? "Identification impossible : " + error + ". Complétez la fiche à la main."
            : c.confidence && c.confidence !== "haute" ? `Confiance de l'IA : ${c.confidence}. ${c.notes || ""} Vérifiez avant d'enregistrer.` : "";
  $("#aiError").textContent = msg; $("#aiError").classList.toggle("hidden", !msg);
  $("#btnDelete").classList.toggle("hidden", !editingId);
  show("viewForm");
}

async function openEdit(id) { editingId = id; fillForm(await api("/api/components/" + id)); }

// Photo : redimensionnée dans le navigateur (envoi rapide, limite 5 Mo de l'IA)
function resize(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b), "image/jpeg", 0.85);
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

$("#fab").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  editingId = null;
  $("#loadingPhoto").src = URL.createObjectURL(file);
  show("viewLoading");
  try {
    const fd = new FormData(); fd.append("photo", await resize(file), "photo.jpg");
    const r = await api("/api/identify", { method: "POST", body: fd });
    fillForm(r, r.error);
  } catch (err) { fillForm({}, err.message); }
};

$("#form").onsubmit = async e => {
  e.preventDefault();
  const f = e.target, body = { photo: currentPhoto };
  for (const el of f.elements) if (el.name) body[el.name] = el.value || null;
  body.quantity = +f.quantity.value || 0;
  body.specs = textToSpecs(f.specs.value);
  await api(editingId ? "/api/components/" + editingId : "/api/components",
            { method: editingId ? "PUT" : "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  show("viewList"); loadList();
};
$("#btnCancel").onclick = () => show("viewList");
$("#btnDelete").onclick = async () => {
  if (!confirm("Supprimer ce composant ?")) return;
  await api("/api/components/" + editingId, { method: "DELETE" }); show("viewList"); loadList();
};

async function loadSettings() {
  const s = await api("/api/settings");
  $("#keyBanner").classList.toggle("hidden", s.api_key_set);
  $("#keyStatus").textContent = s.api_key_from_env ? "Clé fournie par la configuration Umbrel." : s.api_key_set ? "✅ Clé enregistrée." : "Aucune clé enregistrée.";
}
$("#btnSettings").onclick = () => { loadSettings(); show("viewSettings"); };
$("#btnSettingsBack").onclick = () => show("viewList");
$("#btnSaveKey").onclick = async () => {
  if (!$("#apiKey").value) return;
  await api("/api/settings", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ anthropic_api_key: $("#apiKey").value }) });
  $("#apiKey").value = ""; await loadSettings(); show("viewList");
};

loadSettings(); loadList();
</script>
</body>
</html>
