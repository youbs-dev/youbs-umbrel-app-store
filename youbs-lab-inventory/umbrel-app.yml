gallery: []
releaseNotes: >-
  Nouveau menu Dashboard / Composants / Paramètres, tableau de bord (chiffres clés, catégories,
  stock bas, derniers ajouts), choix de l'IA (Claude, ChatGPT, Gemini, Mistral) avec gestion des connecteurs.
