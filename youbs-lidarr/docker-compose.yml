version: "3.7"

services:
  app_proxy:
    environment:
      # Format : <id-app>_<nom-du-service>_1
      APP_HOST: youbs-lidarr_server_1
      APP_PORT: 8686
      PROXY_AUTH_WHITELIST: "/api/*"

  # Paquet officiel Umbrel sans la dependance a Transmission ni le conteneur
  # "mac" (media-app-configurator) : rien n'est configure automatiquement.
  server:
    image: linuxserver/lidarr:3.1.0@sha256:f2a186ce04ec5adb133f92a08dd3efbc918fc71b33077426ef099d94350dfa1b
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      # La connexion Umbrel (app_proxy) protege l'interface web ; l'API demande
      # toujours une cle API.
      - LIDARR__AUTH__METHOD=External
      - LIDARR__AUTH__REQUIRED=Enabled
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      # Seedbox montee par youbs-rclone (FUSE). La propagation rslave fait apparaitre
      # le montage ici des que rclone est pret, meme si cette app a demarre avant lui.
      - type: bind
        source: ${UMBREL_ROOT}/home/Downloads/ftp_share
        target: /seedbox
        bind:
          propagation: rslave
          create_host_path: true
