version: "3.7"

services:
  app_proxy:
    environment:
      # Format : <id-app>_<nom-du-service>_1
      APP_HOST: youbs-rclone_rclone_1
      APP_PORT: 5572

  rclone:
    image: rclone/rclone:1.75.1
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${APP_DATA_DIR}/config/rclone:/config/rclone
      # Monte la seedbox dans le dossier Downloads d'Umbrel, deja visible par Lidarr (/seedbox)
      # Syntaxe longue : la propagation rshared est indispensable pour que
      # le montage FUSE soit visible hors du conteneur (Umbrel, Lidarr...)
      - type: bind
        source: ${UMBREL_ROOT}/home/Downloads/ftp_share
        target: /mnt/seedbox
        bind:
          propagation: rshared
          create_host_path: true
    command: >
      mount seedbox:/ /mnt/seedbox
      --config /config/rclone/rclone.conf
      --allow-other
      --allow-non-empty
      --uid 1000
      --gid 1000
      --umask 002
      --vfs-cache-mode writes
      --dir-cache-time 1m
      --rc
      --rc-addr :5572
      --rc-no-auth
      --rc-web-gui
      --rc-web-gui-no-open-browser
