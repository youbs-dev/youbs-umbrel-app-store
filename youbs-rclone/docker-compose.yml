version: "3.7"

services:
  app_proxy:
    environment:
      # Format : <id-app>_<nom-du-service>_1
      APP_HOST: youbs-rclone_rclone_1
      APP_PORT: 5572

  rclone:
    image: rclone/rclone:1.75.2
    restart: unless-stopped
    # Laisse a rclone le temps de vider le cache d'ecriture et de demonter proprement
    stop_grace_period: 1m
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${APP_DATA_DIR}/config/rclone:/config/rclone
      # Monte la seedbox dans le dossier Downloads d'Umbrel, deja visible par Lidarr (/seedbox)
      # Syntaxe longue : la propagation rshared est indispensable pour que
      # le montage FUSE soit visible hors du conteneur (Umbrel, Lidarr...)
      - type: bind
        source: ${UMBREL_ROOT}/home/Downloads/ftp_share
        target: /mnt/seedbox
        bind:
          propagation: rshared
          create_host_path: true
    # --contimeout/--timeout/--retries : si la seedbox ne repond plus, la lecture
    # echoue au bout de quelques minutes au lieu de rester bloquee indefiniment
    # (panne du 2026-10-31 : une lecture bloquee figeait Radarr et l'interface Umbrel).
    # --vfs-cache-mode full : les fichiers lus sont gardes sur le disque interne
    # (20 Go maximum, 6 h), Radarr/Sonarr ne relisent pas la seedbox a chaque passe.
    command: >
      mount seedbox:/ /mnt/seedbox
      --config /config/rclone/rclone.conf
      --allow-other
      --allow-non-empty
      --uid 1000
      --gid 1000
      --umask 002
      --vfs-cache-mode full
      --vfs-cache-max-size 20G
      --vfs-cache-max-age 6h
      --cache-dir /config/rclone/cache
      --dir-cache-time 1m
      --contimeout 30s
      --timeout 1m
      --low-level-retries 3
      --retries 3
      --rc
      --rc-addr :5572
      --rc-user umbrel
      --rc-pass ${APP_PASSWORD}
      --rc-web-gui
      --rc-web-gui-no-open-browser
