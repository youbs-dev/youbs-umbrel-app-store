manifestVersion: 1
id: youbs-scrutiny
name: Scrutiny
tagline: Santé SMART et températures des disques, y compris ceux du boîtier RAID USB
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/scrutiny.png
category: files
version: "0.10.0.1"
port: 8493
description: >-
  Scrutiny lit les données SMART des disques d'Umbrel (SSD interne et disques du boîtier USB) et les
  présente dans un tableau de bord : état de santé, température, heures de fonctionnement, secteurs
  réalloués, avec un historique.


  Le boîtier RAID USB Orico (pont JMicron JMS567 et puce RAID JMicron JMB39x) ne montre à Linux qu'un
  disque virtuel. Pour lire chaque disque physique, smartctl utilise le mode « jmb39x », qui dialogue
  avec la puce RAID en écrivant puis en effaçant le secteur 33 du volume. Ce secteur est vide sur un
  disque partitionné en GPT et smartctl refuse de l'utiliser s'il ne l'est pas. Ce mode n'est actif que
  si le dossier data/config/autoriser-jmb39x existe dans les fichiers de l'app. Sans lui, seule la
  lecture classique (sans aucune écriture) est faite.


  Au démarrage, une sonde écrit dans data/sonde/sonde.txt ce que smartctl arrive à lire sur chaque disque.


  La collecte a lieu au démarrage puis toutes les heures.
developer: AnalogJ
website: https://github.com/AnalogJ/scrutiny
submitter: youbs
submission: https://github.com/youbs-dev/youbs-umbrel-app-store
