version: "3.7"

services:
  app_proxy:
    environment:
      # Format : <id-app>_<nom-du-service>_1
      APP_HOST: youbs-scrutiny_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/analogj/scrutiny:v0.10.0-omnibus@sha256:90062edac57a2bd891d641344184f5f730f19394b1124f6fc53904a3d8cb21c2
    restart: unless-stopped
    # Acces brut aux disques (commandes SMART via SG_IO). "privileged" plutot
    # qu'une liste "devices" : l'app demarre meme si le boitier USB est
    # debranche ou change de nom (/dev/sdb...).
    privileged: true
    environment:
      - TZ=Europe/Paris
      # Collecte toutes les heures (par defaut : une fois par jour a minuit)
      - COLLECTOR_CRON_SCHEDULE=0 * * * *
    volumes:
      # Informations udev (modele, numero de serie) des disques de l'hote
      - /run/udev:/run/udev:ro
      # collector.yaml est regenere a chaque demarrage par hooks/pre-start
      - ${APP_DATA_DIR}/data/config:/opt/scrutiny/config
      - ${APP_DATA_DIR}/data/influxdb:/opt/scrutiny/influxdb

  # Sonde lancee une fois a chaque demarrage de l'app : ecrit dans
  # data/sonde/sonde.txt ce que smartctl lit sur chaque disque.
  sonde:
    image: ghcr.io/analogj/scrutiny:v0.10.0-omnibus@sha256:90062edac57a2bd891d641344184f5f730f19394b1124f6fc53904a3d8cb21c2
    restart: "no"
    privileged: true
    entrypoint: ["/bin/bash", "/sonde.sh"]
    volumes:
      - ${APP_DATA_DIR}/sonde.sh:/sonde.sh:ro
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/sonde:/out
