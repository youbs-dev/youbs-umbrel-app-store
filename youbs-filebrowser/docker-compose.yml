version: "3.7"

services:
  app_proxy:
    environment:
      # Format : <id-app>_<nom-du-service>_1
      APP_HOST: youbs-filebrowser_server_1
      APP_PORT: 80
      # L'interface reste protegee par la connexion Umbrel. Seuls les liens de
      # partage (page /share, telechargements /api/public, fichiers /static)
      # s'ouvrent sans connexion pour les personnes qui les recoivent.
      PROXY_AUTH_WHITELIST: "/share/*,/api/public/*,/static/*"

  server:
    # Meme image que l'app officielle File Browser d'Umbrel
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/database/
      - ${APP_DATA_DIR}/data:/config/
      - ${UMBREL_ROOT}/data/storage:/data
    environment:
      - GODEBUG=multipathtcp=0
      - FB_PORT=80
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/data
      # Pas de compte File Browser : c'est la connexion Umbrel qui protege l'interface
      - FB_NOAUTH=true
