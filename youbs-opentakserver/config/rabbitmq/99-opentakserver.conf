# Repris de OpenTAKServer-Docker, avec le nom complet du conteneur OTS
# (réseau Docker partagé par toutes les apps Umbrel).
deprecated_features.permit.transient_nonexcl_queues = true

mqtt.listeners.tcp.default = 1883

# Limite la mémoire de RabbitMQ (Umbrel a peu de RAM libre)
vm_memory_high_watermark.absolute = 256MiB

auth_backends.1 = internal
auth_backends.2 = http
auth_http.http_method   = post
auth_http.user_path     = http://youbs-opentakserver_server_1:8081/api/rabbitmq/auth
auth_http.vhost_path    = http://youbs-opentakserver_server_1:8081/api/rabbitmq/vhost
auth_http.resource_path = http://youbs-opentakserver_server_1:8081/api/rabbitmq/resource
auth_http.topic_path    = http://youbs-opentakserver_server_1:8081/api/rabbitmq/topic
