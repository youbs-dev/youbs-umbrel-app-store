# Configuration nginx de youbs-opentakserver, d'après les configurations de
# OpenTAKServer-Installer (nginx_configs/ots_http, ots_https et
# ots_certificate_enrollment). Pas de MediaMTX (vidéo désactivée).

server_tokens off;
client_max_body_size 100M;

# Interface web, servie au proxy Umbrel (port 8491 de l'Umbrel)
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # Host transmis avec le port ($http_host) : sinon socket.io refuse
    # l'origine du navigateur.

    location ~ ^/(api|Marti) {
        proxy_pass http://youbs-opentakserver_server_1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /socket.io {
        proxy_pass http://youbs-opentakserver_server_1:8081/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    try_files $uri /index.html;
}

# API Marti en clair pour les clients TAK
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /Marti/api/tls {
        return 404;
    }

    location ~ ^/(api|Marti) {
        proxy_pass http://youbs-opentakserver_server_1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# API Marti en HTTPS, avec certificat client obligatoire
server {
    listen 8443 ssl;
    root /usr/share/nginx/html;

    ssl_certificate         /app/ots/ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key     /app/ots/ca/certs/opentakserver/opentakserver.nopass.key;
    ssl_client_certificate  /app/ots/ca/ca.pem;
    ssl_verify_client on;

    location /Marti/api/tls {
        return 404;
    }

    location ~ ^/(Marti|files) {
        proxy_pass http://youbs-opentakserver_server_1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ssl-Cert $ssl_client_escaped_cert;
    }

    location /api {
        proxy_pass http://youbs-opentakserver_server_1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ssl-Cert $ssl_client_escaped_cert;
    }
}

# Inscription automatique des certificats (ATAK : identifiant + mot de passe)
server {
    listen 8446 ssl;
    root /usr/share/nginx/html;

    ssl_certificate         /app/ots/ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key     /app/ots/ca/certs/opentakserver/opentakserver.nopass.key;

    location / {
        return 403;
    }

    location /Marti/api/tls {
        proxy_pass http://youbs-opentakserver_server_1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /oauth {
        proxy_pass http://youbs-opentakserver_server_1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
