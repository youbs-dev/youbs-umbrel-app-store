manifestVersion: 1
id: youbs-dawarich
name: Dawarich
tagline: Votre historique de localisation, en privé
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-dawarich/logo.png
category: files
version: "1.15.3.1"
port: 8955
description: >-
  Dawarich permet d'enregistrer, d'explorer et de revivre votre historique de localisation, de façon privée. Vos déplacements sont collectés en continu et transformés en une chronologie interactive : chaque lieu visité y apparaît, et vous pouvez naviguer vers n'importe quelle date pour retrouver vos trajets.


  L'application fournit des statistiques détaillées (distances parcourues, temps passé sur place, villes et pays visités), une carte « à gratter » des pays visités et des cartes interactives de vos itinéraires.


  Vous pouvez importer vos données existantes depuis d'autres outils de suivi, applications sportives, fichiers GPX ou photos géolocalisées, pour réunir tout votre historique au même endroit, sous votre seul contrôle.


  Identifiants par défaut : demo@dawarich.app / safepassword. Changez le mot de passe dès votre première connexion.
developer: ZeitFlow UG
website: https://dawarich.app/
submitter: youbs
submission: https://github.com/youbs-dev/youbs-umbrel-app-store
repo: https://github.com/Freika/dawarich
support: https://github.com/Freika/dawarich/issues
gallery:
  - https://i.imgur.com/yyVG0Jb.jpeg
releaseNotes: >-
  L'API (/api/*) reste accessible quand la connexion Umbrel est activée sur l'app : les applis mobiles
  (OwnTracks, Overland, Dawarich iOS) peuvent de nouveau envoyer vos positions. Adresses autorisées mises à jour
  pour le tailnet Headscale (100.64.0.4 et *.tailnet.youbs.fr).
dependencies: []
path: ""
defaultUsername: "demo@dawarich.app"
defaultPassword: "safepassword"