description: >-
  MoneyMatter est une application open source de suivi de budget et de finances personnelles. Suivez vos soldes et vos transactions par saisie manuelle ou en connectant vos banques, catégorisez vos dépenses et vos revenus, et analysez où passe votre argent.


  L'application gère plusieurs devises (taux de change mis à jour automatiquement par un service intégré), les budgets, les paiements récurrents et leurs rappels, la valeur nette, ainsi que le suivi de portefeuilles d'investissement.


  Vous pouvez importer votre historique depuis un fichier CSV, OFX ou QFX, ou directement depuis YNAB, Wallet (BudgetBakers) et Microsoft Money.


  Au premier lancement, créez votre compte depuis la page d'inscription. Les fonctions optionnelles (synchronisation bancaire, IA, cours de bourse, e-mails) demandent des clés d'API à ajouter dans le docker-compose.
