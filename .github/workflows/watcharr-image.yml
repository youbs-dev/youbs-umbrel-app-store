# Construit l'image Watcharr avec les correctifs youbs (métadonnées TMDB en français)
# et la publie sur ghcr.io, avec pour tag la version déclarée dans youbs-watcharr/umbrel-app.yml.
# La version de Watcharr utilisée est celle indiquée dans src/watcharr/UPSTREAM.
name: Image watcharr
on:
  push:
    branches: [main]
    paths:
      - "src/watcharr/**"
      - "youbs-watcharr/umbrel-app.yml"
      - ".github/workflows/watcharr-image.yml"
  pull_request:
    paths:
      - "src/watcharr/**"
      - ".github/workflows/watcharr-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire les versions
        id: version
        run: |
          echo "version=$(grep '^version:' youbs-watcharr/umbrel-app.yml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(tr -d '[:space:]' < src/watcharr/UPSTREAM)" >> "$GITHUB_OUTPUT"
      - name: Récupérer Watcharr ${{ steps.version.outputs.upstream }}
        uses: actions/checkout@v4
        with:
          repository: sbondCo/Watcharr
          ref: ${{ steps.version.outputs.upstream }}
          path: upstream
      - name: Appliquer les correctifs
        working-directory: upstream
        run: |
          for p in ../src/watcharr/patches/*.patch; do
            echo "Application de $p"
            git apply --verbose "$p"
          done
      - name: Tests des correctifs
        working-directory: upstream/server
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.27-alpine sh -c "apk add -q --no-cache gcc musl-dev && go vet ./media/tmdb/ && CGO_ENABLED=1 go test ./media/tmdb/"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 seulement : le serveur Umbrel est en x86_64, et la compilation Go
      # avec cgo sous émulation arm64 prendrait très longtemps.
      - uses: docker/build-push-action@v6
        with:
          context: upstream
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/youbs-dev/watcharr:${{ steps.version.outputs.version }}
