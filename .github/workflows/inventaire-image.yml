# Construit l'image de l'app « Inventaire composants » (amd64 + arm64) et la publie sur ghcr.io,
# avec pour tag la version déclarée dans youbs-inventaire/umbrel-app.yml.
name: Image inventaire
on:
  push:
    branches: [main]
    paths:
      - "src/inventaire/**"
      - "youbs-inventaire/umbrel-app.yml"
      - ".github/workflows/inventaire-image.yml"
  pull_request:
    paths:
      - "src/inventaire/**"
      - ".github/workflows/inventaire-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version
        id: version
        run: echo "version=$(grep '^version:' youbs-inventaire/umbrel-app.yml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/inventaire
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/youbs-dev/inventaire-composants:${{ steps.version.outputs.version }}
